<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timberline Raid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Saira+Condensed:wght@500;600;700;800&display=swap">
<style>
/* Layout: full-screen canvas game, HUD pinned to the four corners, modal panels centered over the action. Single dark look by design. */
:root{
  --bg:#12140f; --panel:#1b1f17; --panel2:#232a1d; --line:#3b4530; --line2:#2c3424;
  --text:#e2dcc2; --mute:#9d9b84; --accent:#e2a23a; --accent-ink:#1c1607;
  --hp:#7fb44f; --danger:#d4553f; --good:#8cc46a; --cool:#79aac4;
  --display:'Saira Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--display);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none;background:var(--bg)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;font-family:var(--display)}
#hud button{pointer-events:auto}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);padding:0 4px;color:var(--mute);background:rgba(0,0,0,.35)}
#tl{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));width:min(290px,60vw);display:flex;flex-direction:column;gap:8px}
.hpwrap{background:rgba(14,16,11,.78);border:1px solid var(--line);padding:8px 10px 9px}
.hplabel{display:flex;justify-content:space-between;font-weight:700;letter-spacing:.12em;font-size:13px;color:var(--mute)}
#hpnum{font-family:var(--mono);color:var(--text);letter-spacing:0}
.hpbar{height:14px;background:#2a1a16;margin-top:4px;position:relative;overflow:hidden}
#hpfill{height:100%;width:100%;background:var(--hp);transition:width .12s linear}
#hpfill.low{background:var(--danger)}
.stambar{height:8px;background:#1f241a;margin-top:4px}
.arbar{height:6px;background:#1c2226;margin-top:4px}
#arfill{height:100%;width:0;background:#8fb3c9;transition:width .12s linear}
.hplabel.sm{margin-top:6px;font-size:12px;gap:10px}
#arnum{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#stam{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(240px,40vw);background:rgba(14,16,11,.78);border:1px solid var(--line);padding:6px 10px 8px}
#stamfill.tired{background:var(--danger)}
#stam .hplabel{gap:8px;white-space:nowrap}#stam .stamkeys{font-size:11px;letter-spacing:.04em}
#magcv{width:46px;height:78px;flex:none}
.wtext{text-align:right}
#stamfill{height:100%;width:100%;background:var(--cool)}
#buffs{display:flex;gap:6px;flex-wrap:wrap}
.buff{background:rgba(14,16,11,.78);border:1px solid var(--line);font-size:13px;padding:2px 7px;font-weight:600;letter-spacing:.04em}
.buff b{font-family:var(--mono);font-weight:400;color:var(--accent);margin-left:4px}
#cash{background:rgba(14,16,11,.78);border:1px solid var(--line);padding:5px 10px;font-family:var(--mono);font-size:13px}
#cash .found{color:var(--accent)}
#tracker{display:flex;flex-direction:column;gap:4px}
.trk{background:rgba(14,16,11,.7);border-left:3px solid var(--accent);padding:3px 8px;font-size:12.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trkhead{font:inherit;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:rgba(14,16,11,.78);border:1px solid var(--line);color:var(--mute);padding:3px 8px;cursor:pointer;text-align:left;align-self:flex-start;display:flex;gap:6px;align-items:center}
.trkhead:hover{color:var(--text);border-color:var(--accent)}
.trkhead b{color:var(--good);font-weight:700}
.trkhead kbd{font-size:10px}
#tracker{gap:3px!important}
.trk.done{border-left-color:var(--good);color:var(--good)}
.trk span{font-family:var(--mono);font-size:12px;color:var(--mute);margin-left:6px}
#tc{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);text-align:center}
#loc{font-weight:800;letter-spacing:.2em;font-size:15px;text-transform:uppercase;color:var(--mute)}
#timer{font-family:var(--mono);font-size:20px}
#exbar{margin-top:4px;font-weight:700;font-size:18px;color:var(--good);letter-spacing:.06em}
#tr{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));display:flex;gap:8px}
.hudbtn{font:inherit;font-weight:800;letter-spacing:.12em;font-size:15px;background:rgba(14,16,11,.85);color:var(--text);border:1px solid var(--accent);padding:8px 12px;cursor:pointer;display:flex;gap:8px;align-items:center}
.hudbtn:hover{background:var(--accent);color:var(--accent-ink)}
.hudbtn:hover kbd{color:var(--accent-ink);border-color:var(--accent-ink)}
.hudbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
#br{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;background:rgba(14,16,11,.78);border:1px solid var(--line);padding:8px 14px;min-width:170px}
#wname{font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
#wslots{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:5px}
#wslots .ws{font-size:12px;font-weight:700;letter-spacing:.04em;border:1px solid var(--line);padding:1px 6px 2px;color:var(--mute);pointer-events:auto;cursor:pointer;white-space:nowrap}
#wslots .ws.on{border-color:var(--accent);color:var(--text);background:rgba(226,162,58,.12)}
#wslots .ws kbd{margin-right:4px;font-size:10px;padding:0 3px}
body.mobile #wslots .ws kbd{display:none}
#wammo{font-family:var(--mono);font-size:30px;line-height:1.05}
#wammo small{font-size:15px;color:var(--mute)}
#wsub{font-size:13px;color:var(--mute);letter-spacing:.04em}
#wsub .warn{color:var(--danger)}
.heat{display:inline-block;width:64px;height:7px;background:#2a2a22;border:1px solid var(--line);vertical-align:middle;margin:0 4px}
.heat i{display:block;height:100%;background:linear-gradient(90deg,#e2a23a,#d4553f)}
.heat.over i{background:#d4553f}
#bc{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;max-width:calc(100vw - 420px)}
#prompt{font-weight:700;font-size:18px;letter-spacing:.06em;background:rgba(14,16,11,.85);border:1px solid var(--accent);padding:5px 12px;color:var(--text)}
#prompt:empty{display:none}
#usebar{width:240px;height:18px;background:rgba(14,16,11,.85);border:1px solid var(--line);position:relative}
#usefill{height:100%;background:var(--good);width:0}
#usetxt{position:absolute;inset:0;font-size:13px;font-weight:700;letter-spacing:.08em;display:flex;align-items:center;justify-content:center;text-transform:uppercase}
#hotbar{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.slot{background:rgba(14,16,11,.8);border:1px solid var(--line);padding:3px 7px 4px;min-width:56px;font-size:13px;line-height:1.15;display:flex;flex-direction:column}
.slot.on{border-color:var(--accent)}
.slot.empty{opacity:.4}
.slot b{font-weight:700;white-space:nowrap}
.slot i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--accent)}
#toasts{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;align-items:flex-end;max-width:min(380px,70vw)}
.toast{background:rgba(14,16,11,.92);border-left:3px solid var(--accent);padding:6px 10px;font-size:15px;font-weight:600;animation:tin .2s ease-out}
.toast.good{border-left-color:var(--good)}
.toast.bad{border-left-color:var(--danger)}
@keyframes tin{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}#hpfill{transition:none}}

#panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(920px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto;background:var(--panel);border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.65);z-index:20;cursor:default}
#panel header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:16px 20px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
#panel h2{margin:0;font-size:30px;line-height:1;font-weight:800;letter-spacing:.05em;text-transform:uppercase;text-wrap:balance}
#panel h3{margin:18px 0 6px;font-size:15px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
#panel .sub{color:var(--mute);font-size:15px;margin-top:4px}
#panel .sub b{color:var(--accent);font-family:var(--mono);font-weight:600}
.body{padding:4px 20px 20px}
.x{font:inherit;font-size:20px;background:transparent;border:1px solid var(--line);color:var(--text);width:38px;height:38px;cursor:pointer;flex:none}
.x:hover{border-color:var(--accent)}
.item{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.item>div:first-child{flex:1 1 200px;min-width:0}
.item .nm{font-size:20px;font-weight:700;letter-spacing:.02em}
.item .ds{color:var(--mute);font-size:15px;line-height:1.3;max-width:62ch}
.meta{font-family:var(--mono);font-size:12px;color:#7f8a6c;display:block;margin-top:2px}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.price{font-family:var(--mono);color:var(--accent);font-size:15px;min-width:80px;text-align:right}
.btn{font:inherit;font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border:0;padding:8px 14px;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{background:#33392c;color:#6f725f;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.big{font-size:20px;padding:12px 26px}
.btn.danger{background:var(--danger);color:#fff}
.btn:focus-visible,.tab:focus-visible,.x:focus-visible{outline:2px solid #fff;outline-offset:2px}
.tabs{display:flex;gap:2px;padding:12px 20px 0;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.pk-slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:8px 0}
.pk-slot{border:1px solid var(--line);background:rgba(0,0,0,.25);padding:9px 10px;display:flex;flex-direction:column;gap:6px;min-height:76px}
.pk-slot small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.pk-slot b{font-size:15px}.pk-slot.empty{border-style:dashed;opacity:.7}.pk-slot .btn{align-self:flex-start;padding:4px 10px;font-size:13px}
.pk-pick{border:1px solid var(--line);margin-top:6px}
.pk-pick summary{cursor:pointer;list-style:none;padding:9px 12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--accent);display:flex;justify-content:space-between;align-items:center}
.pk-pick summary::-webkit-details-marker{display:none}.pk-pick summary:after{content:'▾';transition:transform .15s}.pk-pick[open] summary:after{transform:rotate(180deg)}
.pk-list{max-height:280px;overflow:auto;border-top:1px solid var(--line);padding:4px 12px 10px}
.pk-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.pk-row span{min-width:0}.pk-row em{display:block;font-style:normal;font-size:12px;color:var(--mute)}.pk-row .btn{padding:4px 10px;font-size:13px;flex:none}
.gs{margin-top:10px;background:radial-gradient(ellipse at 50% 35%,#2b3324 0%,#161a12 70%);border:1px solid var(--line);position:relative;overflow:hidden}
.gs:before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(226,162,58,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(226,162,58,.05) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.gs-top{display:flex;justify-content:space-between;align-items:flex-end;padding:12px 16px 0;position:relative}
.gs-name{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:34px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.gs-kick{font-size:12px;letter-spacing:.3em;color:var(--accent);font-weight:700;text-transform:uppercase}
.gs-cnt{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--mute)}.gs-cnt b{color:var(--accent)}
#gscv{display:block;width:100%;height:auto;position:relative}
.gs-guns{display:flex;gap:6px;padding:0 16px;flex-wrap:wrap;position:relative}
.gs-gun{font:inherit;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.35);color:var(--mute);border:1px solid var(--line);padding:5px 10px;cursor:pointer}
.gs-gun.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.gs-slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;padding:10px 16px 14px;position:relative}
.gs-slot{font:inherit;text-align:left;background:rgba(10,12,8,.7);border:1px solid var(--line);border-left:3px solid var(--line);padding:8px 10px;cursor:pointer;color:var(--text);min-height:58px}
.gs-slot small{display:block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
.gs-slot b{font-size:15px;font-weight:700}.gs-slot.has{border-left-color:var(--good)}.gs-slot.has b{color:var(--good)}
.gs-slot.on{border-color:var(--accent);border-left-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 18px rgba(226,162,58,.25)}
.gs-slot.na{opacity:.38;cursor:default}
.gs-pick{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;padding:14px 16px 16px;border-top:1px solid var(--line);background:rgba(0,0,0,.25);position:relative}
@media (max-width:640px){.gs-pick{grid-template-columns:1fr}.gs-name{font-size:26px}}
.gs-opt h4{margin:0 0 4px;font-family:'Saira Condensed',sans-serif;font-size:22px;letter-spacing:.05em;text-transform:uppercase}
.gs-opt p{margin:0 0 10px;color:var(--mute);font-size:14px;line-height:1.35}
.gs-stat{display:grid;grid-template-columns:86px 1fr 52px;align-items:center;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:5px 0}
.gs-bar{height:8px;background:rgba(255,255,255,.07);position:relative}
.gs-bar i{position:absolute;top:0;bottom:0;left:0;background:#cfc8ad}.gs-bar u{position:absolute;top:0;bottom:0;background:var(--good)}.gs-bar s{position:absolute;top:0;bottom:0;background:var(--danger)}
.gs-stat em{font-style:normal;font-family:'IBM Plex Mono',monospace;text-align:right;color:var(--text);letter-spacing:0}
.gs-stat em.up{color:var(--good)}.gs-stat em.dn{color:var(--danger)}
.tab{font:inherit;font-weight:700;font-size:16px;letter-spacing:.1em;text-transform:uppercase;background:transparent;color:var(--mute);border:0;border-bottom:3px solid transparent;padding:6px 14px 8px;cursor:pointer}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.cols>section{min-width:0}
@media (max-width:680px){.cols{grid-template-columns:1fr}}
.empty{color:var(--mute);font-size:15px;padding:8px 0}
.cat{border:1px solid var(--line2);border-left:4px solid var(--c,var(--accent));background:rgba(255,255,255,.015);padding:10px 14px 4px;margin-top:14px}
#panel .cat h3{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 8px;color:var(--text);font-size:17px}
.cat h3 .cnt{font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:0;text-transform:none;font-weight:400}
.cat .side{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--c,var(--accent));border-bottom:1px solid var(--line);padding-bottom:4px}
.cat .item{padding:7px 0}.cat .item .nm{font-size:17px}.cat .item .ds{font-size:14px}
.cat .cols{gap:22px}
.prog{height:6px;background:#2a3122;margin-top:6px;max-width:320px}
.prog>div{height:100%;background:var(--accent)}
.prog.done>div{background:var(--good)}
.reward{font-family:var(--mono);color:var(--good);font-size:16px}
.mapwrap{padding:12px 20px 4px}
#mapcv{display:block;width:100%;height:auto;background:#1a1f14;border:1px solid var(--line)}
.legend{display:flex;gap:18px;flex-wrap:wrap;padding:8px 20px 18px;color:var(--mute);font-size:14px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.hero{padding:26px 24px 22px}
.hero h1{margin:0;font-size:clamp(48px,9vw,92px);line-height:.85;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{color:var(--mute);font-size:18px;max-width:58ch;line-height:1.35}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 22px;margin:16px 0 22px;font-size:16px}
.keys div{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--line2);padding:4px 0}
.keys kbd{font-size:13px;color:var(--text);min-width:58px;text-align:center}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.stat div{background:var(--panel2);padding:10px 12px}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-weight:600}
.stat span{color:var(--mute);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.banner{font-size:clamp(40px,7vw,70px);font-weight:800;line-height:.9;text-transform:uppercase;letter-spacing:.03em;margin:0}
.banner.good{color:var(--good)} .banner.bad{color:var(--danger)}
.gunny{display:flex;gap:12px;align-items:center;padding:10px 20px 0;color:var(--mute);font-size:16px;font-style:italic}
#mobilewarn{display:none}
body.mobile #mobilewarn{display:none!important}
#touch{position:fixed;inset:0;pointer-events:none;z-index:6;user-select:none;-webkit-user-select:none}
.stick{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(14,16,11,.38);border:2px solid rgba(226,220,194,.28);pointer-events:auto;touch-action:none}
#stickL{left:calc(18px + env(safe-area-inset-left,0px))}#stickR{right:calc(18px + env(safe-area-inset-right,0px))}
.stick .knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(226,220,194,.38);border:2px solid rgba(226,220,194,.5)}
.stick span{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.14em;color:rgba(226,220,194,.45)}
#tbtns{position:absolute;right:calc(160px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,54px);gap:6px;pointer-events:auto}
#tbtns button{font:inherit;font-weight:800;font-size:12px;letter-spacing:.04em;width:54px;height:42px;padding:0;background:rgba(14,16,11,.62);color:var(--text);border:1px solid var(--line);touch-action:none;cursor:pointer}
#tbtns button:active,#tbtns button.held{background:var(--accent);color:var(--accent-ink)}
#tbtns button.ready{border-color:var(--accent);color:var(--accent)}
body.mobile #tl{width:min(230px,40vw)}
body.mobile .hpwrap{padding:6px 8px}
body.mobile #tracker .trk{font-size:12px}
body.mobile #bc{left:calc(160px + env(safe-area-inset-left,0px));transform:none;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 160px - 470px);min-width:150px;align-items:flex-start}
body.mobile #hotbar{justify-content:flex-start}
body.mobile .slot{min-width:0;font-size:11px;padding:2px 5px}
body.mobile .slot kbd{display:none}
body.mobile #br{top:calc(62px + env(safe-area-inset-top,0px));bottom:auto;padding:5px 10px;min-width:0}
body.mobile #magcv{width:30px;height:52px}

function mKey(m){return m.t+(m.w?':'+m.w:'');}
function genMission(){
  const used=new Set([...S.missions.active,...S.missions.available].map(mKey));
  for(let tries=0;tries<80;tries++){
    const m=pick(MTYPES);let w=null;
    if(m.t==='killw')w=pick(['ak','m4','glock','deagle','mp7','inferno','sniper','m249','pkm','m870','ump']);
    if(used.has(mKey({t:m.t,w})))continue;
    const n=rndi(m.n[0],m.n[1]);
    const reward=Math.round((m.per*n*rnd(0.95,1.35)+6000)/500)*500;
    return{id:S.nextMid++,t:m.t,n,w,prog:0,reward,txt:m.txt(n,w)};
  }
  return null;
}
function fillMissions(){
  const seen=new Set(S.missions.active.map(mKey));
  S.missions.available=S.missions.available.filter(m=>{const k=mKey(m);if(seen.has(k))return false;seen.add(k);return true;});
  while(S.missions.available.length<4){const m=genMission();if(!m)break;S.missions.available.push(m);}
}
function mEvent(type,d){
  for(const m of S.missions.active){
    if(m.prog>=m.n)continue;let inc=0;
    if(type==='kill'){
      if(d.dog){if(m.t==='dogs')inc=1;}
      else{if(m.t==='kill')inc=1;if(m.t==='killw'&&d.w===m.w)inc=1;if(m.t==='heavy'&&d.heavy)inc=1;if(m.t==='boss'&&d.boss)inc=1;}
    }
    if(type==='loot'&&m.t==='loot')inc=1;
    if(type==='cache'&&m.t==='cache')inc=1;
    if(type==='extract'){if(m.t==='extract')inc=1;if(m.t==='extractw'&&d.weapons>=m.n)inc=m.n;}
    if(inc){m.prog=Math.min(m.n,m.prog+inc);ui.trkFlashUntil=GT+4;if(m.prog>=m.n)toast(`Mission complete: ${m.txt}. Claim ${fmt(m.reward)} at the board.`,'good');}
  }
}

function makeGrid(L){

  L.grid=Array.from({length:L.cols*L.rows},()=>[]);
  for(const o of L.obs){
    let x0,y0,x1,y1;
    if(o.k==='r'){x0=o.x;y0=o.y;x1=o.x+o.w;y1=o.y+o.h;}else{x0=o.x-o.r;y0=o.y-o.r;x1=o.x+o.r;y1=o.y+o.r;}
    const gx0=clamp(Math.floor(x0/L.cell),0,L.cols-1),gx1=clamp(Math.floor(x1/L.cell),0,L.cols-1);
    const gy0=clamp(Math.floor(y0/L.cell),0,L.rows-1),gy1=clamp(Math.floor(y1/L.cell),0,L.rows-1);
    for(let gy=gy0;gy<=gy1;gy++)for(let gx=gx0;gx<=gx1;gx++)L.grid[gy*L.cols+gx].push(o);

let QS=1;const QBUF=[];
function nearObs(L,x,y,rad){

  const y0=Math.max(0,Math.floor((y-rad)/c)),y1=Math.min(L.rows-1,Math.floor((y+rad)/c));
  for(let gy=y0;gy<=y1;gy++)for(let gx=x0;gx<=x1;gx++){const a=L.grid[gy*L.cols+gx];for(let i=0;i<a.length;i++){const o=a[i];if(o._q!==QS){o._q=QS;QBUF.push(o);}}}

function doorDist(o,x,y){const a=o.base+o.ang,dx=Math.cos(a),dy=Math.sin(a);let t=(x-o.hx)*dx+(y-o.hy)*dy;t=clamp(t,0,o.len);return Math.hypot(x-(o.hx+dx*t),y-(o.hy+dy*t));}

    if(o.k==='d'){if((bullet||los)&&doorDist(o,x,y)<3.6)return o;continue;}
    if(o.kind==='window'){if(los||(bullet&&!o.intact))continue;}
    else if((bullet||los)&&o.pass)continue;
    if(o.k==='r'){if(x>=o.x&&x<=o.x+o.w&&y>=o.y&&y<=o.y+o.h)return o;}
    else{const dx=x-o.x,dy=y-o.y;if(dx*dx+dy*dy<o.r*o.r)return o;}

function hurtPlayer(dmg,src){
  if(player.dead||mode!=='raid')return;if(src!=='blood loss'&&src!=='burns')fightPing();

  else if(ar&&ar.dur>0){const A=ARMOR[ar.id];const blocked=dmg*A.red;dmg-=blocked;ar.dur=Math.max(0,ar.dur-blocked*0.7-dmg*0.08);if(ar.dur<=0)toast(`Your ${A.name} broke. Gunny can repair it.`,'bad');}
  player.hp-=dmg;player.hurt=Math.min(1,player.hurt+dmg/28);shake=Math.min(10,shake+dmg*0.3);

    if(R()<ch){const was=player.bleed||0;player.bleed=Math.min(2,was+(dmg>=40?2:1));
      if(!was){const bi=MED_ORDER.filter(k=>MEDS[k].stopBleed&&S.gear.meds[k]>0).map(k=>`${MEDS[k].name} (${medKey(MED_ORDER.indexOf(k))})`)[0];toast(`You're bleeding! ${bi?'Use a '+bi:'Get a bandage or medkit'} to stop it.`,'bad');}

  if(player.useT>0&&dmg>6){player.useT=0;player.useMed=null;toast('Healing interrupted','bad');}
  if(player.hp<=0){player.hp=0;player.dead=true;if(RAID&&RAID.defense)RAID.endPending=true;else endRaid(false,src);}
}

    let ammoLost=0;for(const[a,n] of Object.entries(RAID.lootAmmo||{})){const extra=Math.max(0,(g.ammo[a]||0)-(RAID.startAmmo[a]||0));const k=Math.min(n,extra);ammoLost+=k;addTo(g.ammo,a,-k);}

/* ---- pathfinding (A* on a 20px grid) ---- */
const NDX=[1,-1,0,0,1,1,-1,-1],NDY=[0,0,1,-1,1,-1,1,-1];

let navBudget=0;
function moveTo(e,tx,ty,speed,dt){

  if(e.pathT<=0||moved){
    if(walkLine(e.x,e.y,tx,ty)){e.path=null;e.direct=true;e.pathT=0.4+R()*0.3;}
    else if(navBudget>0){navBudget--;e.direct=false;const pth=findPath(e.x,e.y,tx,ty);e.pi=0;e.ptx=tx;e.pty=ty;
      if(pth&&pth.length){e.path=pth;e.pathT=1+R()*0.6;}
      else{e.path=null;e.pathT=1+R();

function update(dt){

  if(p.burn>0&&!p.dead){p.burn-=dt;hurtPlayer(6*dt,'burns');}

    const len=Math.hypot(mx,my);if(len>1){mx/=len;my/=len;}
    const w=activeW();let sp=168*(w?WEAPONS[w.id].move:1)*armorMove(S.gear.armor)*(S.gear.bag&&BAGS[S.gear.bag]?BAGS[S.gear.bag].move:1);
    const wasScoped=p.scoped;p.scoped=!!(mouse.rdown&&w&&w.scope&&!ui.open);if(p.scoped)sp*=0.55;
    if(wasScoped&&!p.scoped&&!MOBILE)mouse.easing=true;

    const sprint=!p.sneaking&&(keys.ShiftLeft||keys.ShiftRight||(MOBILE&&len>0.92))&&len>0&&p.stam>4&&p.useT<=0;
    if(sprint){sp*=1.5;p.stam=Math.max(0,p.stam-24*dt);}else p.stam=Math.min(100,p.stam+(len?12:20)*dt);
    if(p.useT>0)sp*=0.5;if(p.sneaking)sp*=0.45;

    const ox=p.x,oy=p.y;p.x+=mx*sp*dt;p.y+=my*sp*dt;resolve(L,p,p.r);

      if(g.heatIdle>0.25)g.heat=Math.max(0,g.heat-(g.over?24:32)*(g.cool?1.6:1)*dt);
      if(g.over){if(R()<dt*14)sparks.push({x:p.x+Math.cos(p.ang)*(p.r+26)+rnd(-4,4),y:p.y+Math.sin(p.ang)*(p.r+26)+rnd(-4,4),vx:rnd(-10,10),vy:rnd(-40,-15),life:0.5,col:'rgba(220,220,210,.6)'});
        if(g.heat<=35){g.over=false;toast('Barrel cooled. Ready to fire.');}}}

    if(p.useT>0){p.useT-=dt;if(p.useT<=0){p.useT=0;finishMed();}}

  updateDoors(dt);updateBullets(dt);updateFlames(dt);updateGrenades(dt);updateSmokes(dt);updateFires(dt);updateGas(dt);if(player.fragCd>0)player.fragCd-=dt;

    let best=null,bd=64;

    const AR=L.base&&L.base.armory;
    if(AR&&!AR.lock.open){const lk=AR.lock;if(dist(p.x,p.y,lk.x+lk.w/2,lk.y+lk.h/2)<62){nearTarget={kind:'lockdoor'};if(!ui.open)promptTxt=RAID.key?'<kbd>E</kbd> Unlock the armory':'Locked armory · needs the <b>Ironwood Armory Key</b> (the base commander carries it)';best=null;}}
    if(best)nearTarget=best;if(best&&!ui.open)promptTxt=`<kbd>E</kbd> ${best.vault?'Open armory vault':best.kind==='cache'?'Open weapons cache':best.kind==='lootbox'?'Open loot box':best.kind==='crate'?'Search crate':'Loot body'}${best.items.length?'':' (empty)'}`;
    if(ui.open==='loot'&&ui.container&&dist(p.x,p.y,ui.container.x,ui.container.y)>95)closePanel();
    if(ui.open==='dogpack'&&(!pet||pet.down||dist(p.x,p.y,pet.x,pet.y)>120))closePanel();
    let inside=null;for(const x of RAID.extracts)if(dist(p.x,p.y,x.x,x.y)<x.r)inside=x;

    nearTarget=best;if(best&&!ui.open)promptTxt=`<kbd>E</kbd> ${best.label}`;
  }
}

    const ox=clamp(dx/d*K,-(VW/2-70),VW/2-70),oy=clamp(dy/d*K,-(VH/2-70),VH/2-70);
    cam.ox=(cam.ox??ox)+(ox-(cam.ox??ox))*0.09;cam.oy=(cam.oy??oy)+(oy-(cam.oy??oy))*0.09; // glide, don't snap
    tx+=(p.x+cam.ox-tx)*cam.z;ty+=(p.y+cam.oy-ty)*cam.z;}else{cam.ox=undefined;cam.oy=undefined;}
  if(L.isSafe){const inR=p.x>1100,x0=inR?1100-VW*0.25:0,x1=inR?L.w:1100;const w=x1-x0;const want=w<=VW?(x0+x1)/2:clamp(tx,x0+VW/2,x1-VW/2);

  else cam.x=L.w<=VW?L.w/2:clamp(tx,VW/2,L.w-VW/2);
  if(L.isSafe){const pad=150;cam.y=L.h+pad<=VH?(L.h+pad)/2:clamp(ty,VH/2,L.h-VH/2+pad);}

function castLaser(x,y,ang,max,owner){
  const c=Math.cos(ang),s=Math.sin(ang);let d=0;
  for(;d<max;d+=5){const px=x+c*d,py=y+s*d;if(pointHits(L,px,py,false,true))return d;
    if(owner==='player'){for(const e of enemies)if(!e.dead&&(px-e.x)**2+(py-e.y)**2<e.r*e.r)return d;if(L.dummies)for(const dm of L.dummies)if((px-dm.x)**2+(py-dm.y)**2<256)return d;}
    else if((px-player.x)**2+(py-player.y)**2<player.r*player.r)return d;}
  return d;
}

  ctx.strokeStyle=g;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();

function setH(id,html){if(hc[id]!==html){hc[id]=html;document.getElementById(id).innerHTML=html;}}
function setW(id,pct){const k=id+'w';const v=pct.toFixed(1);if(hc[k]!==v){hc[k]=v;document.getElementById(id).style.width=v+'%';}}
function updateHUD(){
  const p=player;const hp=Math.ceil(p.hp);
  setH('hpnum',`${hp} / ${MAX_HP}`);setW('hpfill',hp/MAX_HP*100);setW('stamfill',p.stam);
  setH('stamlbl',p.sneaking?'<span style="color:var(--good)">SNEAKING</span>':'STAMINA');
  if(MOBILE){const sb=document.querySelector('#tbtns [data-t=sneak]');const on=!!touch.sneak;if(hc.snk!==on){hc.snk=on;sb.classList.toggle('held',on);}}
  const tired=p.stam<20;if(hc.tired!==tired){hc.tired=tired;$('#stamfill').classList.toggle('tired',tired);}
  const ar=S.gear.armor;if(ar&&ar.ins){setH('arnum',`${PLATES[ar.ins.id].name.split(' ').slice(-2).join(' ')} · ${Math.round(ar.ins.dur)}/${PLATES[ar.ins.id].dur}`);setW('arfill',ar.ins.dur/PLATES[ar.ins.id].dur*100);}else{setH('arnum',ar?`${ARMOR[ar.id].name}${isCarrier(ar)?' (no plate)':''} · ${Math.round(ar.dur)}/${ARMOR[ar.id].dur}`:'None');setW('arfill',ar?ar.dur/ARMOR[ar.id].dur*100:0);}
  const low=hp<30;if(hc.low!==low){hc.low=low;$('#hpfill').classList.toggle('low',low);}
  setH('buffs',Object.entries(p.buffs).map(([k,b])=>`<span class="buff">${BUFF_NAMES[k]}<b>${Math.ceil(b.t)}s</b></span>`).join('')+(p.burn>0?'<span class="buff" style="border-color:#d4553f">Burning</span>':'')+(p.bleed>0?`<span class="buff" style="border-color:#d4553f;color:#ff8a78">${p.bleed===2?'Heavy bleeding':'Bleeding'}<b>−${p.bleed===2?1.8:0.7} HP/s</b></span>`:''));
  setH('cash',mode==='raid'&&RAID?`Stash ${fmt(S.money)} · <span class="found">Found ${fmt(RAID.cash)}</span>`:`Cash ${fmt(S.money)}`);
  {const A=S.missions.active;const done=A.filter(m=>m.prog>=m.n).length;const show=ui.trkOpen||GT<(ui.trkFlashUntil||0);
   setH('tracker',A.length?`<button type="button" class="trkhead" data-trk="1">Missions ${A.length}${done?` · <b>${done} ready</b>`:''} ${show?'▾':'▸'} <kbd>J</kbd></button>`+(show?A.map(m=>`<div class="trk ${m.prog>=m.n?'done':''}" title="${m.txt}">${m.txt}<span>${m.prog}/${m.n}</span></div>`).join(''):''):'');}
  if(mode==='raid'&&RAID){
    const t=Math.max(0,Math.ceil(RAID.time));if(RAID.defense){setH('loc',`Rooftop Defense · Wave ${RAID.wave}`);setH('timer',RAID.dstate==='wave'?`${RAID.toSpawn+enemies.filter(e=>!e.dead&&e.def).length} left`:RAID.dstate==='break'?'Cleared · use radio':'Ready');}else{setH('loc',L.name+(RAID.night?' · Night':''));setH('timer',`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`);}
    setH('exbar',RAID.exT>0?`EXTRACTING · ${Math.max(0,(RAID.easy?3:6)-RAID.exT).toFixed(1)}s`:'');
  }else{setH('loc','The Bunker · Safe house');setH('timer','');setH('exbar','');}
  const w=activeW();
  setH('wslots',SLOTS.map(s=>{const g=S.gear[s];return g?`<span class="ws ${player.slot===s?'on':''}" data-ws="${s}"><kbd>${SLOT_KEY[s]}</kbd>${WEAPONS[g.id].name}</span>`:'';}).join(''));
  if(w){const W=WEAPONS[w.id];setH('wname',W.name);setH('wammo',`${w.mag}<small> / ${inRangeRoom()?'∞':S.gear.ammo[ammoOf(w)]||0}</small>`);
    let sub=AMMO[ammoOf(w)].name+(W.alt?' (B)':'')+(W.auto?' · Auto':fireW(w).burst?' · Burst':' · Semi');
    if(W.heatPerShot){const ht=Math.round(w.heat||0);sub+=` · ${w.over?'<span class="warn">OVERHEATED</span>':'Heat'}<span class="heat ${w.over?'over':''}"><i style="width:${ht}%"></i></span>`;}
    if(w.scope)sub+=p.scoped?' · <span style="color:var(--cool)">SCOPED</span>':' · Scope (hold RMB)';
    if(w.gl)sub+=` · <span class="${S.gear.ammo['40mm']?'':'warn'}">GL ${S.gear.ammo['40mm']||0}</span>${p.glCd>0?' (loading)':''} (RMB)`;
    if(w.laser)sub+=` · Laser ${S.laserOn===false?'off':'on'} (L)`;
    if(W.flame)sub+=` · <span class="${S.gear.ammo.fuel?'':'warn'}">Fuel ${S.gear.ammo.fuel||0}</span> (RMB)`;
    if(w.jammed&&!(p.reload>0))sub='<span class="warn">JAMMED · press R to clear</span>';
    else if(p.reload>0)sub=p.clearing?'<span class="warn">Clearing jam…</span>':p.clipLoad?`<span class="warn">${W.clipName==='speedloader'?'Speedloader':W.clipName==='moon clip'?'Moon clip':'Stripper clip'}…</span>`:W.perRound?`<span class="warn">Loading rounds…</span> click to stop and fire`:'<span class="warn">Reloading…</span>';
    else if(W.bolt&&p.cd>0&&w.mag>0)sub='Working the bolt…';else if(w.mag===0)sub='<span class="warn">Empty · press R</span>';
    setH('wsub',sub);}
  else{setH('wname','Unarmed');setH('wammo','—');setH('wsub','Buy a weapon from Gunny');}
  drawMagHud(w);
  setH('prompt',promptTxt);
  if(MOBILE){const r=!!nearTarget;if(hc.useR!==r){hc.useR=r;document.querySelector('#tbtns [data-t=use]').classList.toggle('ready',r);}}
  const ub=$('#usebar');const using=p.useT>0;if(ub.hidden===using)ub.hidden=!using;
  if(using){setW('usefill',(1-p.useT/p.useMax)*100);setH('usetxt','Using '+MEDS[p.useMed].name);}
  let hb='';
  if(S.gear.ammo.smoke)hb+=`<div class="slot" data-hk="1"><kbd>C</kbd><b>Smoke</b><i>×${S.gear.ammo.smoke}</i></div>`;
  if(S.gear.ammo.molotov)hb+=`<div class="slot"><kbd>Q</kbd><b>Molotov</b><i>×${S.gear.ammo.molotov}</i></div>`;
  if(S.gear.ammo.flash)hb+=`<div class="slot"><kbd>C</kbd><b>Flash</b><i>×${S.gear.ammo.flash}</i></div>`;
  if(S.gear.ammo.frag)hb+=`<div class="slot" data-hg="1"><kbd>G</kbd><b>Frag</b><i>×${S.gear.ammo.frag}</i></div>`;
  MED_ORDER.forEach((id,i)=>{const n=S.gear.meds[id]||0;if(n)hb+=`<div class="slot" data-hm="${id}"><kbd>${medKey(i)}</kbd><b>${MEDS[id].name}</b><i>×${n}</i></div>`;});
  if(!Object.keys(S.gear.meds).length)hb+=`<div class="slot empty"><kbd>4–0</kbd><b>No meds</b><i>buy from Gunny</i></div>`;
  setH('hotbar',hb);
  $('#mapbtn').hidden=false;
}

/* ================= MAG HUD ================= */
let magKey='';
function drawMagHud(w){
  const W=w?WEAPONS[w.id]:null;const key=W?`${w.id}|${w.mag}|${player.reload>0}|${ammoOf(w)}|${magCap(w)}`:'none';if(key===magKey)return;magKey=key;
  const c=document.getElementById('magcv');const g=c.getContext('2d');g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,46,78);if(!W)return;
  const cap=magCap(w),n=w.mag,low=n/cap<0.25;
  const edge=low?'rgba(212,85,63,.95)':'rgba(220,214,190,.85)';const glass='rgba(200,215,205,.10)';
  const round=(x,y,wd,ht)=>{g.fillStyle='#c9a04a';g.fillRect(x,y,wd*0.72,ht);g.fillStyle='#b06a38';g.fillRect(x+wd*0.72,y+ht*0.12,wd*0.28,ht*0.76);g.fillStyle='rgba(255,240,190,.5)';g.fillRect(x,y,wd*0.72,Math.max(0.6,ht*0.25));};
  const AM=ammoOf(w);
  if(w.id==='viper'||w.id==='ranger'||w.id==='mgl'){const cx=23,cy=40,R0=17,gr=w.id==='mgl',gcol=ammoOf(w)==='40fl'?'#d8d8cc':ammoOf(w)==='40gas'?'#c9c25a':'#5a6a3a';g.fillStyle='rgba(200,215,205,.12)';g.beginPath();g.arc(cx,cy,R0+3,0,TAU);g.fill();g.strokeStyle=edge;g.lineWidth=1.5;g.stroke();
    for(let i=0;i<cap;i++){const a=-Math.PI/2+i*TAU/cap,x=cx+Math.cos(a)*R0*0.62,y=cy+Math.sin(a)*R0*0.62;
      if(i<n){g.fillStyle=gr?gcol:'#c9a04a';g.beginPath();g.arc(x,y,4.6,0,TAU);g.fill();g.fillStyle=gr?'#c9a04a':'#8a6a26';g.beginPath();g.arc(x,y,2,0,TAU);g.fill();}
      else{g.fillStyle='rgba(0,0,0,.45)';g.beginPath();g.arc(x,y,4.6,0,TAU);g.fill();g.strokeStyle='rgba(255,255,255,.15)';g.lineWidth=1;g.stroke();}}
    g.fillStyle=edge;g.beginPath();g.arc(cx,cy,2.5,0,TAU);g.fill();return;}
  if(AM==='12'||AM==='12slug'||AM==='12db'){
    /* see-through shell tube: shells lie sideways, brass head left, coloured hull right */
    const hull=AM==='12slug'?'#3d8a3a':AM==='12db'?'#e0782a':'#b8322a',hullD=AM==='12slug'?'#25591f':AM==='12db'?'#9a4a14':'#7a1c16';
    const cols=cap>10?2:1,rows=Math.ceil(cap/cols),top=5,bot=73,tw=cols===2?40:30,tx=23-tw/2,sh=(bot-top-4)/rows;
    g.fillStyle=glass;g.fillRect(tx,top,tw,bot-top);g.strokeStyle=edge;g.lineWidth=1.5;g.strokeRect(tx,top,tw,bot-top);
    g.fillStyle='rgba(220,214,190,.6)';g.fillRect(tx-2,bot,tw+4,3);
    const shell=(x,y,len,ht)=>{const hd=len*0.24;
      g.fillStyle='#c9a04a';g.fillRect(x,y,hd,ht);g.fillStyle='#8a6a26';g.fillRect(x,y-0.6,1.4,ht+1.2);
      g.fillStyle='rgba(255,240,190,.55)';g.fillRect(x+1.4,y+0.4,hd-1.4,Math.max(0.6,ht*0.22));
      g.fillStyle=hull;g.fillRect(x+hd,y+0.4,len-hd,ht-0.8);
      g.fillStyle='rgba(255,255,255,.22)';g.fillRect(x+hd,y+0.6,len-hd,Math.max(0.6,ht*0.2));
      g.fillStyle=hullD;g.fillRect(x+hd,y+ht-1.2,len-hd,0.8);g.fillRect(x+len-1.6,y+0.4,1.6,ht-0.8);
      g.fillStyle='rgba(0,0,0,.35)';for(let k=1;k<3;k++)g.fillRect(x+len-1.6-k*1.6,y+ht*0.3,0.6,ht*0.4);};
    const len=cols===2?16:24,ht=Math.min(9,sh*0.78);
    for(let i=0;i<cap;i++){const col=cols===2?i%2:0,row=cols===2?Math.floor(i/2):i;const x=tx+3+col*(len+2),y=bot-3-(row+1)*sh+(sh-ht)/2;
      if(i<n)shell(x,y,len,ht);else{g.fillStyle='rgba(255,255,255,.05)';g.fillRect(x,y,len,ht);}}
  }else if(cap>=100){
    // translucent ammo box with belt rows
    g.fillStyle=glass;g.fillRect(5,10,36,62);g.strokeStyle=edge;g.lineWidth=1.5;g.strokeRect(5,10,36,62);
    g.fillStyle='rgba(220,214,190,.5)';g.fillRect(3,7,40,4);
    const rows=14,per=4,total=rows*per,show=Math.ceil(n/cap*total);
    for(let i=0;i<total;i++){const r=Math.floor(i/per),col=i%per;const y=68-r*4.2,x=8+col*8;
      if(i<show)round(x,y,7,3);else{g.fillStyle='rgba(255,255,255,.06)';g.fillRect(x,y,7,3);}}
    g.fillStyle=edge;g.font='600 8px "IBM Plex Mono", monospace';g.textAlign='center';g.fillText(Math.round(n/cap*100)+'%',23,6);
  }else{
    const curve=w.id==='ak'?9:w.id==='m4'?4:0;const top=6,bot=74,h=bot-top;const wd=cap<=5?22:cap<=17?14:18;
    const xAt=t=>23-wd/2+curve*t*t;
    g.beginPath();g.moveTo(xAt(0),top);for(let i=1;i<=20;i++){const t=i/20;g.lineTo(xAt(t),top+h*t);}g.lineTo(xAt(1)+wd,bot);for(let i=20;i>=0;i--){const t=i/20;g.lineTo(xAt(t)+wd,top+h*t);}g.closePath();
    g.fillStyle=glass;g.fill();g.strokeStyle=edge;g.lineWidth=1.5;g.stroke();
    g.fillStyle='rgba(220,214,190,.6)';g.fillRect(xAt(1)-2,bot,wd+4,3);
    const dbl=cap>=20;const slots=dbl?Math.ceil(cap/2):cap;const sh=(h-4)/slots;
    for(let i=0;i<cap;i++){const row=dbl?Math.floor(i/2):i;const t=(row+0.5)/slots;const y=top+2+row*sh;const x=xAt(t)+(dbl?(i%2?wd*0.42:wd*0.08):wd*0.12);const rw=dbl?wd*0.5:wd*0.76;
      if(i<n)round(x,y,rw,Math.max(1.2,sh*(dbl?1.6:0.8)));else{g.fillStyle='rgba(255,255,255,.05)';g.fillRect(x,y,rw,Math.max(1,sh*0.6));}}
  }
}

/* ================= PANELS ================= */
const ui={open:null,tab:'weapons',container:null,sum:null,confirmReset:false};
function openPanel(name,opts={}){ui.open=name;Object.assign(ui,opts);ui.confirmReset=false;ui.confirmLoad=false;renderPanel();$('#panel').hidden=false;mouse.down=false;mouse.rdown=false;}
function closePanel(){ui.open=null;ui.rebinding=false;ui.container=null;$('#panel').hidden=true;}
function head(t,sub){return`<header><div><h2>${t}</h2>${sub?`<div class="sub">${sub}</div>`:''}</div><button class="x" data-act="close" aria-label="Close" type="button">✕</button></header>`;}
function itemRow(nm,ds,actsHtml){return`<div class="item"><div><div class="nm">${nm}</div>${ds?`<div class="ds">${ds}</div>`:''}</div><div class="acts">${actsHtml}</div></div>`;}
function btn(act,v,label,dis,cls=''){return`<button class="btn ${cls}" type="button" data-act="${act}" data-v="${v}" ${dis?'disabled':''}>${label}</button>`;}
function priceTag(n){return`<span class="price">${fmt(n)}</span>`;}
function renderPanel(){
  const p=$('#panel');let h='';
  switch(ui.open){
    case'start':h=panelStart();break;case'trader':h=panelTrader();break;case'board':h=panelBoard();break;case'store':h=panelStore();break;
    case'deploy':h=panelDeploy();break;case'loot':h=panelLoot();break;case'inv':h=panelInv();break;case'map':h=panelMap();break;
    case'menu':h=panelMenu();break;case'saves':h=panelSaves();break;case'summary':h=panelSummary();break;case'upgrades':h=panelUpgrades();break;case'chem':h=panelChem();break;case'kennel':h=panelKennel();break;case'k9':h=panelK9();break;case'press':h=panelPress();break;case'defcmd':h=panelDefCmd();break;case'defradio':h=panelDefRadio();break;case'defsum':h=panelDefSum();break;case'dogpack':h=panelDogPack();break;
  }
  p.innerHTML=h;if(ui.open==='map')drawMap();if(ui.open==='trader'&&ui.tab==='attach')drawGunsmith();
}
const CONTROLS=[['WASD','Move'],['Shift','Sprint'],['Ctrl','Sneak: hold to walk slowly and quietly'],['Mouse','Aim'],['LMB','Shoot'],['RMB','Flamethrower / grenade launcher'],['G','Throw frag grenade'],['C','Throw smoke grenade or flashbang (carry one kind)'],['Q','Throw Molotov'],['R','Reload'],['B','Switch ammo (M870: buckshot / slugs · M32: thermobaric / flash / gas)'],['L','Laser sight on/off'],['__kick','Kick (knocks back dogs)'],['1 / 2 / 3','Primary / primary 2 / sidearm'],['4 – 0','Use healing item'],['E','Interact / loot'],['F','Take all (in loot)'],['Tab','Inventory'],['M','Map'],['J','Show / hide mission list']];
function controlsHtml(){return`<div class="keys">${CONTROLS.map(([k,v])=>`<div><kbd>${k==='__kick'?keyLabel(S.keys.kick):k}</kbd><span>${v}</span></div>`).join('')}</div>`;}
function panelStart(){
  return`<div class="hero"><h1>Timber<em>line</em><br>Raid</h1>
  <p>Gear up in the bunker, buy guns and meds from Gunny, then drop into the woods. Kill soldiers and dogs, loot their bodies, finish contracts for big payouts, and reach an extract before the 25-minute clock runs out. Die out there and you keep your gear, but lose the cash and backpack loot you found.</p>
  <div class="acts" style="justify-content:flex-start;margin:4px 0 6px"><span style="color:var(--mute);font-size:16px">Controls:</span>${btn('controls',0,MOBILE?'Mobile (touch)':'PC (keyboard & mouse)',false,'ghost')}<span class="meta" style="display:inline">tap to switch</span></div>
  <h3>Choose a save</h3>${slotsHtml()}
  <h3>Controls</h3>${controlsHtml()}</div>`;
}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function slotsHtml(){
  let h='';
  for(let i=1;i<=SAVE_COUNT;i++){
    const x=i===activeSlot&&readSlot(i)?S:readSlot(i);const cur=i===activeSlot&&ui.open!=='start';
    if(x){const d=x.lastPlayed?new Date(x.lastPlayed).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';

      h+=itemRow(`${esc(x.name||'Save '+i)}${cur?' <span class="meta" style="display:inline;color:var(--good)">· playing now</span>':''}`,`Cash ${fmt(x.money)} · ${x.stats.raids} raids · ${x.stats.extracts} extracts · ${x.stats.kills} kills${d?' · last played '+d:''}`,

    else h+=itemRow(`Save ${i}`,'Empty slot · starts with $8,000 and a Glock 19',btn('play',i,'New game'));
  }

}
function panelSaves(){return head('Save Slots',`Playing <b>${esc(S.name)}</b> · your progress saves automatically`)+`<div class="body">${slotsHtml()}</div>`;}
/* ===== companion dog ===== */
let pet=null;
const DOG_MAX=5;
function dogNeed(l){return 150*l;}
function dogStats(l){return{hp:80+30*l,bite:14+5*l,spd:180+10*l,nose:330+50*l};}
const DOG_PERKS=[[1,'Follows you, barks at enemies he smells and marks them for 4 s'],[2,'Bigger nose: smells enemies from farther away'],[3,'Takedown: his bites knock soldiers off balance'],[4,'Tougher and faster'],[5,'Second wind: heals himself when the fight is over']];
function spawnPet(){pet=null;if(!hasUp('kennel')||!S.dog)return;
  if(S.dog.hurt){S.dog.hurt=0;toast(`${S.dog.name} is still healing and sits this raid out.`);return;}
  if(!S.dog.bring)return;const st=dogStats(S.dog.lvl);const q=findFree(L,player.x-30,player.y+20,12,60)||{x:player.x,y:player.y};
  const ar=S.dog.armor&&DOG_ARMOR[S.dog.armor];if(ar&&ar.spd)st.spd*=ar.spd;const pk=S.dog.packItems||[];RAID.dogPack=pk.slice(0,dogCap());S.dog.packItems=pk.slice(dogCap());
  pet={type:'pet',x:q.x,y:q.y,r:12,ang:0,side:1,stuck:0,hp:st.hp,maxhp:st.hp,walk:0,cd:0,barkCd:2,scanT:0,target:null,down:false,st};}
const DOG_ARMOR={padded:{name:'Padded K9 Vest',red:0.2,price:8000,col:'#6a6a4a',desc:'Quilted vest. Blocks 20% of the damage Rex takes.'},
  kevlar:{name:'Kevlar K9 Vest',red:0.35,price:20000,col:'#3d4a3a',desc:'Soft body armor cut for a dog. Blocks 35%.'},
  plated:{name:'Plated K9 Vest',red:0.5,price:40000,col:'#2a2f33',spd:0.94,desc:'Steel plates on the chest and sides. Blocks 50%, but he runs about 6% slower.'}};
const DOG_PACKS={saddle:{name:'K9 Saddlebags',cap:2,price:12000,desc:'Two side pouches. Rex carries 2 extra weapons, armor or plates for you.'},
  pack:{name:'K9 Field Pack',cap:4,price:28000,desc:'A proper harness pack. Rex carries 4 extra items.'}};
const DOG_TREATS={price:6000,xp:50};
function dogCap(){return S.dog&&S.dog.pack&&DOG_PACKS[S.dog.pack]?DOG_PACKS[S.dog.pack].cap:0;}
function dogRoom(){return pet&&!pet.down&&RAID?dogCap()-(RAID.dogPack||[]).length:0;}
function packPush(x){if(RAID.pack.length<packMax()){RAID.pack.push(x);return true;}
  if(dogRoom()>0){RAID.dogPack.push(x);toast(`Backpack full, so ${S.dog.name} carries it.`);return true;}return false;}
function dropDogPack(){if(!RAID||!RAID.dogPack||!RAID.dogPack.length||!pet)return;containers.push({x:pet.x,y:pet.y,kind:'pile',items:RAID.dogPack.map(instItem),searched:true});
  toast(`${S.dog.name} dropped his pack where he fell. Go grab it.`,'bad');RAID.dogPack=[];}
function hurtPet(d){if(!pet||pet.down)return;const ar=S.dog.armor&&DOG_ARMOR[S.dog.armor];if(ar)d*=1-ar.red;pet.hp-=d;spark(pet.x,pet.y,'#8a1e16',4,120);if(pet.hp<=0){pet.hp=0;pet.down=true;pet.target=null;floater(pet.x,pet.y-20,'YELP','#ffb347',14);toast(`${S.dog.name} is hurt and limps back to the bunker.`,'bad');dropDogPack();}}
function updatePet(dt){

  swapUtil(id){if(!RAID||!RAID.bagAmmo||!(RAID.bagAmmo[id]>0))return;const o=utilBlock(id);if(o){addTo(RAID.bagAmmo,o,S.gear.ammo[o]);delete S.gear.ammo[o];}
    addTo(S.gear.ammo,id,RAID.bagAmmo[id]);delete RAID.bagAmmo[id];toast(`Now carrying ${AMMO[id].name}s${o?`; your ${AMMO[o].name}s went in the backpack`:''}.`);sfx('click');renderPanel();},
  buyA(id){const A=AMMO[id];if(utilBlock(id)){toast(utilMsg(id),'bad');return;}if(S.money<A.price)return;S.money-=A.price;addTo(S.gear.ammo,id,A.pack);sfx('buy');save();renderPanel();},
  buyA5(id){const A=AMMO[id];if(utilBlock(id)){toast(utilMsg(id),'bad');return;}if(S.money<A.price*5)return;S.money-=A.price*5;addTo(S.gear.ammo,id,A.pack*5);sfx('buy');save();renderPanel();},
  buyM(id){const M=MEDS[id];if(S.money<M.price)return;S.money-=M.price;if(medRoom(id)>0)addTo(S.gear.meds,id,1);else if(pocketCount()<POCKET_CAP){addTo(S.gear.pocket,id,1);toast(`${M.name} went into your pockets.`);}else{addTo(S.stash.meds,id,1);toast(`${medFullMsg(id)} Pockets full, so it went to your stash.`);}sfx('buy');save();renderPanel();},
  gsGun(v){ui.gsSlot=v;ui.gsCat=null;renderPanel();},
  gsCat(v){ui.gsCat=v;renderPanel();},
  addAtt(v){const[s,k]=v.split(':');const w=S.gear[s];const A=ATTACH[k];if(!w||!A||w[k])return;const W=WEAPONS[w.id];
    if(attList(w).length>=maxAtt(w)){toast(`That gun already has ${maxAtt(w)} attachments. Remove one first.`,'bad');return;}
    if(!attFits(k,w.id)){toast(`The ${A.name.toLowerCase()} only fits the ${attOnlyName(k)}.`,'bad');return;}
    if((k==='gl'||k==='scope')&&(W.flame||w.gl||w.scope)){toast('That gun’s right-click slot is taken (flamethrower, grenade launcher or scope).','bad');return;}if(S.money<attPrice(k,w.id))return;
    S.money-=attPrice(k,w.id);w[k]=true;if(k==='laser')S.laserOn=true;
    toast(`${A.name} fitted to your ${W.name}`,'good');
    if(k==='gl'&&!(S.gear.ammo['40mm']>0))toast('Don’t forget 40mm grenades (Ammunition tab).');
    sfx('buy');save();renderPanel();},
  remAtt(v){const[s,k]=v.split(':');const w=S.gear[s];const A=ATTACH[k];if(!w||!A||!w[k])return;delete w[k];const ref=k==='gl'?attPrice(k,w.id):Math.round(attPrice(k,w.id)*SELL);S.money+=ref;if(A.extra&&w.mag>magCap(w)){addTo(S.gear.ammo,ammoOf(w),w.mag-magCap(w));w.mag=magCap(w);}toast(`Removed the ${A.name.toLowerCase()} (+${fmt(ref)})`);save();renderPanel();},
  buyGL(s){const w=S.gear[s];if(!w||w.gl||WEAPONS[w.id].flame||S.money<GL_PRICE)return;S.money-=GL_PRICE;w.gl=true;toast(`Grenade launcher fitted to your ${WEAPONS[w.id].name}. Right-click to fire.`,'good');if(!(S.gear.ammo['40mm']>0))toast('Don’t forget 40mm grenades (Ammunition tab).');sfx('buy');save();renderPanel();},
  buyLaser(s){const w=S.gear[s];if(!w||w.laser||S.money<LASER_PRICE)return;S.money-=LASER_PRICE;w.laser=true;S.laserOn=true;toast(`Laser fitted to your ${WEAPONS[w.id].name}`,'good');sfx('buy');save();renderPanel();},
  buyBag(id){const Bg=BAGS[id];if(!Bg||S.gear.bag===id)return;if(mode==='raid')return;const old=S.gear.bag&&BAGS[S.gear.bag];const trade=old?Math.round(old.price*SELL):0;const cost=Bg.price-trade;
    if(S.money<cost)return;S.money-=cost;S.gear.bag=id;toast(old?`Traded your ${old.name} in for a ${Bg.name} (${Bg.cap} slots)`:`Bought a ${Bg.name}: ${Bg.cap} loot slots`,'good');sfx('buy');save();renderPanel();},
  buyPlate(id){const P=PLATES[id];if(S.money<P.price)return;S.money-=P.price;const pl=newPlate(id);const ga=S.gear.armor;
    if(isCarrier(ga)&&!ga.ins){ga.ins=pl;toast(`Bought ${P.name} and slid it into your carrier`,'good');}
    else{const k=toStorage(pl);toast(`${P.name} sent to your ${STORE_NAME[k]}${isCarrier(ga)?' (carrier already has a plate)':''}`,'good');}sfx('buy');save();renderPanel();},
  plateToPack(){const ga=S.gear.armor;if(!ga||!ga.ins||RAID.pack.length>=packMax())return;RAID.pack.push(ga.ins);ga.ins=null;renderPanel();},
  buyArm(id){const A=ARMOR[id];if(S.money<A.price)return;S.money-=A.price;const a={id,dur:A.dur,armor:true};if(A.carrier)a.ins=null;
    if(!S.gear.armor){S.gear.armor=a;toast(`Bought and put on ${A.name}`,'good');}else{const k=toStorage(a);toast(`${A.name} sent to your ${STORE_NAME[k]}`,'good');}sfx('buy');save();renderPanel();},
  repair(){const a=S.gear.armor;if(!a)return;const c=repairCost(a);if(S.money<c)return;S.money-=c;a.dur=ARMOR[a.id].dur;if(a.ins)a.ins.dur=PLATES[a.ins.id].dur;toast(`${ARMOR[a.id].name} repaired`,'good');sfx('buy');save();renderPanel();},
  sell(v){const[k,kind,id]=v.split(':');const st=S[k];
    if(kind==='w'||kind==='arm'){const list=kind==='w'?st.weapons:st.armor;const x=list[+id];if(!x)return;S.money+=instValue(x);list.splice(+id,1);}
    else if(kind==='ammo'){const n=st.ammo[id]||0;S.money+=Math.round(n*AMMO[id].price/AMMO[id].pack*SELL);delete st.ammo[id];}
    else if(kind==='med'){if(!(st.meds[id]>0))return;S.money+=Math.round(MEDS[id].price*SELL);addTo(st.meds,id,-1);}
    sfx('buy');save();renderPanel();},
  sellAllW(k){let t=0;for(const w of S[k].weapons)t+=instValue(w);S.money+=t;S[k].weapons=[];toast(`Sold weapons for ${fmt(t)}`,'good');sfx('buy');save();renderPanel();},
  accept(id){if(S.missions.active.length>=3)return;const i=S.missions.available.findIndex(m=>m.id==id);if(i<0)return;S.missions.active.push(S.missions.available.splice(i,1)[0]);save();renderPanel();},
  claim(id){const i=S.missions.active.findIndex(m=>m.id==id);if(i<0)return;const m=S.missions.active[i];if(m.prog<m.n)return;S.money+=m.reward;S.stats.earned+=m.reward;S.missions.done++;S.missions.active.splice(i,1);toast(`Paid ${fmt(m.reward)}`,'good');sfx('buy');save();renderPanel();},
  abandon(id){S.missions.active=S.missions.active.filter(m=>m.id!=id);save();renderPanel();},
  reroll(){if(S.money<1000){toast('Posting new contracts costs $1,000.','bad');return;}S.money-=1000;S.missions.available=[];fillMissions();toast('New contracts posted (−$1,000)');save();renderPanel();},
  put(v){const[k,kind,id,amt]=v.split(':');const st=S[k],g=S.gear;
    if(kind==='plate'){if(storeFull(k)||!g.armor||!g.armor.ins)return;st.armor.push(g.armor.ins);g.armor.ins=null;}
    else if(kind==='slot'){if(storeFull(k))return;const x=g[id];if(!x)return;(x.armor?st.armor:st.weapons).push(x);g[id]=null;player.reload=0;ensureSlot();}
    else if(kind==='ammo'){const n=amt==='all'?(g.ammo[id]||0):Math.min(AMMO[id].pack,g.ammo[id]||0);addTo(st.ammo,id,n);addTo(g.ammo,id,-n);}
    else if(kind==='med'){const n=amt==='all'?(g.meds[id]||0):Math.min(1,g.meds[id]||0);addTo(st.meds,id,n);addTo(g.meds,id,-n);}
    else if(kind==='pmed'){const n=g.pocket[id]||0;addTo(st.meds,id,n);addTo(g.pocket,id,-n);}
    save();renderPanel();},
  get(v){const[k,kind,id,amt]=v.split(':');const st=S[k],g=S.gear;
    if(kind==='w'){const x=st.weapons[+id];if(!x)return;const slot=equipSlot(x.id);st.weapons.splice(+id,1);if(g[slot])st.weapons.push(g[slot]);g[slot]=x;player.slot=slot;player.reload=0;}
    else if(kind==='arm'){const x=st.armor[+id];if(!x)return;
      if(x.pl){if(!isCarrier(g.armor))return;st.armor.splice(+id,1);if(g.armor.ins)st.armor.push(g.armor.ins);g.armor.ins=x;}
      else{st.armor.splice(+id,1);if(g.armor)st.armor.push(g.armor);g.armor=x;}}
    else if(kind==='ammo'){if(utilBlock(id)){toast(utilMsg(id),'bad');return;}const n=amt==='all'?(st.ammo[id]||0):Math.min(AMMO[id].pack,st.ammo[id]||0);addTo(g.ammo,id,n);addTo(st.ammo,id,-n);}
    else if(kind==='pmed'){const n=Math.min(st.meds[id]||0,amt==='all'?99:1,POCKET_CAP-pocketCount());if(n<=0){toast(`Your pockets are full (${POCKET_CAP} items).`,'bad');return;}addTo(g.pocket,id,n);addTo(st.meds,id,-n);}
    else if(kind==='med'){let n=amt==='all'?(st.meds[id]||0):Math.min(1,st.meds[id]||0);n=Math.min(n,medRoom(id));if(n<=0){toast(medFullMsg(id),'bad');return;}addTo(g.meds,id,n);addTo(st.meds,id,-n);}
    save();renderPanel();},
  move(v){const[k,kind,id]=v.split(':');const o=k==='stash'?'locker':'stash';if(storeFull(o))return;const from=kind==='w'?S[k].weapons:S[k].armor,to=kind==='w'?S[o].weapons:S[o].armor;const x=from[+id];if(!x)return;from.splice(+id,1);to.push(x);save();renderPanel();},
  openStore(k){openPanel('store',{store:k});},
  deploy(v){startRaid(v==='night'||v==='easynight',v==='easy'||v==='easynight');},
  mapSel(v){ui.mapSel=v;renderPanel();},
  take(i){if(ui.container&&takeItem(ui.container,+i))renderPanel();},
  takeAll(){takeAll();},
  toPack(s){if(RAID.pack.length>=packMax())return;const w=S.gear[s];if(!w)return;RAID.pack.push(w);S.gear[s]=null;player.reload=0;ensureSlot();renderPanel();},
  dropSlot(s){const w=S.gear[s];if(!w)return;containers.push({x:player.x,y:player.y,kind:'pile',items:[instItem(w)],searched:true});S.gear[s]=null;player.reload=0;ensureSlot();renderPanel();},
  equipP(i){const w=RAID.pack[+i];if(!w)return;
    if(w.pl){const ga=S.gear.armor;if(!isCarrier(ga))return;RAID.pack.splice(+i,1);if(ga.ins)RAID.pack.push(ga.ins);ga.ins=w;renderPanel();return;}
    const slot=w.armor?'armor':equipSlot(w.id);RAID.pack.splice(+i,1);if(S.gear[slot])RAID.pack.push(S.gear[slot]);S.gear[slot]=w;if(!w.armor){player.slot=slot;player.reload=0;}renderPanel();},
  dropP(i){const w=RAID.pack[+i];if(!w)return;RAID.pack.splice(+i,1);containers.push({x:player.x,y:player.y,kind:'pile',items:[instItem(w)],searched:true});renderPanel();},
  sound(){S.sound=!S.sound;save();renderPanel();},
  exportSave(){exportSave();},
  loadFile(){if(mode==='raid')return;if(!ui.confirmLoad){ui.confirmLoad=true;renderPanel();return;}ui.confirmLoad=false;renderPanel();$('#loadfile').value='';$('#loadfile').click();},
  toBelt(id){if(inCombat()){toast('Too dangerous to dig through your pockets right now.','bad');renderPanel();return;}
    const n=Math.min(S.gear.pocket[id]||0,medRoom(id));if(n<=0){toast(medFullMsg(id),'bad');return;}addTo(S.gear.meds,id,n);addTo(S.gear.pocket,id,-n);sfx('click');renderPanel();},
  toPocket(id){const n=Math.min(S.gear.meds[id]||0,POCKET_CAP-pocketCount());if(n<=0){toast(`Your pockets are full (${POCKET_CAP} items).`,'bad');return;}addTo(S.gear.pocket,id,n);addTo(S.gear.meds,id,-n);sfx('click');renderPanel();},
  controls(){setMobile(!MOBILE);toast(MOBILE?'Mobile controls on: left stick moves, right stick aims and fires when pushed far.':'PC controls on.');renderPanel();},
  rebind(){ui.rebinding=true;renderPanel();},
  resetKick(){S.keys.kick='KeyV';ui.rebinding=false;save();renderPanel();},
  reset(){if(!ui.confirmReset){ui.confirmReset=true;const p=$('#panel');renderPanelKeepConfirm();return;}
    S=newSave(activeSlot);save();closePanel();enterSafe();toast('Progress wiped. Fresh start.');},
  toSafe(){closePanel();enterSafe();},
};
function renderPanelKeepConfirm(){$('#panel').innerHTML=panelMenu();}
$('#panel').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;initAudio();const f=ACT[b.dataset.act];if(f)f(b.dataset.v);});

/* ================= LOOP ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  const menuPause=ui.open==='menu'||ui.open==='saves'||ui.open==='start'||ui.open==='summary';
  if(!paused&&!menuPause)update(dt);
  render();updateHUD();
  if(ui.open==='map')drawMap();
  if(mouse.easing&&mouse.rx!=null){mouse.x+=(mouse.rx-mouse.x)*0.3;mouse.y+=(mouse.ry-mouse.y)*0.3;if(Math.abs(mouse.rx-mouse.x)+Math.abs(mouse.ry-mouse.y)<3){mouse.x=mouse.rx;mouse.y=mouse.ry;mouse.easing=false;}}
  if(ui.open==='inv'){const f=inCombat();if(f!==ui.lastFight){ui.lastFight=f;renderPanel();}}
  requestAnimationFrame(frame);
}
/* ================= MOBILE CONTROLS ================= */
const touch={move:{x:0,y:0}};
function setMobile(on){MOBILE=on;try{localStorage.setItem('timberline-controls',on?'mobile':'pc');}catch(e){}
  document.body.classList.toggle('mobile',on);$('#touch').hidden=!on;touch.move.x=touch.move.y=0;mouse.down=mouse.rdown=false;
  if(on){mouse.x=VW/2+120;mouse.y=VH/2;}}
function bindStick(el,onMove,onEnd){let id=null;const knob=el.querySelector('.knob');
  const upd=e=>{const r=el.getBoundingClientRect();const max=r.width/2;let dx=e.clientX-(r.left+max),dy=e.clientY-(r.top+max);const m=Math.hypot(dx,dy);if(m>max){dx*=max/m;dy*=max/m;}knob.style.transform=`translate(${dx}px,${dy}px)`;onMove(dx/max,dy/max);};
  el.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();id=e.pointerId;try{el.setPointerCapture(id);}catch(_){}upd(e);});
  el.addEventListener('pointermove',e=>{if(e.pointerId===id){e.preventDefault();upd(e);}});
  const end=e=>{if(e.pointerId!==id)return;id=null;knob.style.transform='';onEnd();};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);}
bindStick($('#stickL'),(x,y)=>{touch.move.x=x;touch.move.y=y;},()=>{touch.move.x=touch.move.y=0;});
bindStick($('#stickR'),(x,y)=>{const m=Math.hypot(x,y);if(m>0.12){const a=Math.atan2(y,x);const r=90+m*260;mouse.x=VW/2+Math.cos(a)*r;mouse.y=VH/2+Math.sin(a)*r;}mouse.down=m>0.6&&!ui.open&&!paused;},()=>{mouse.down=false;});
$('#tbtns').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-t]');if(!b)return;e.preventDefault();initAudio();if(paused&&b.dataset.t!=='map')return;
  const t=b.dataset.t;
  if(t==='alt'){mouse.rdown=true;b.classList.add('held');const up=ev=>{mouse.rdown=false;b.classList.remove('held');removeEventListener('pointerup',up);removeEventListener('pointercancel',up);};addEventListener('pointerup',up);addEventListener('pointercancel',up);}
  else if(t==='use'){if(ui.open==='loot')closePanel();else if(!ui.open)interact();}
  else if(t==='reload')startReload();
  else if(t==='ammo')switchAmmo();
  else if(t==='nade')throwFrag();
  else if(t==='smoke')throwSmoke();
  else if(t==='flash')throwFlash();
  else if(t==='molotov')throwMolotov();
  else if(t==='kick')kick();
  else if(t==='swap'){const have=SLOTS.filter(k=>S.gear[k]);if(have.length>1)switchSlot(have[(have.indexOf(player.slot)+1)%have.length]);}
  else if(t==='bag'){if(ui.open==='inv')closePanel();else if(!ui.open||ui.open==='loot'||ui.open==='map')openPanel('inv');}
  else if(t==='sneak'){touch.sneak=!touch.sneak;}
  else if(t==='map'){if(paused)return;if(ui.open==='map')closePanel();else openPanel('map');}
});
async function exportSave(){
  save();const data=JSON.stringify({game:'timberline-raid',version:1,exported:new Date().toISOString(),save:S});
  const name=`timberline-${String(S.name||'save').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}-${new Date().toISOString().slice(0,10)}.json`;
  let dl=null;try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads');}catch(e){dl=null;}
  if(dl){try{await dl.save({filename:name,data});toast(`Saved ${name}`,'good');}catch(e){if(e&&e.code==='declined')toast('Save file cancelled.');else if(e&&e.code==='rate_limited')toast('A save prompt is already open.');else toast('Saving files isn’t available here.','bad');}return;}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);toast(`Saved ${name}`,'good');}catch(e){toast('Couldn’t create the file.','bad');}
}
$('#loadfile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const j=JSON.parse(rd.result);const x=j&&j.save?j.save:j;if(!x||!x.gear||!x.stash||typeof x.money!=='number')throw new Error('bad');
      S=migrate(x);save();RANGE.shots=RANGE.hits=0;closePanel();enterSafe();toast(`Loaded ${S.name} from ${f.name}`,'good');}
    catch(err){toast('That file isn’t a Timberline Raid save.','bad');}};
  rd.onerror=()=>toast('Couldn’t read that file.','bad');rd.readAsText(f);});
function toggleTrk(){ui.trkOpen=!ui.trkOpen;ui.trkFlashUntil=0;try{localStorage.setItem('timberline-trk',ui.trkOpen?'1':'0');}catch(e){}}
try{ui.trkOpen=localStorage.getItem('timberline-trk')==='1';}catch(e){}
$('#tracker').addEventListener('click',e=>{if(e.target.closest('[data-trk]'))toggleTrk();});
$('#wslots').addEventListener('click',e=>{const t=e.target.closest('[data-ws]');if(!t||paused||ui.open==='start')return;switchSlot(t.dataset.ws);});
$('#hotbar').addEventListener('click',e=>{if(!MOBILE||paused)return;const sl=e.target.closest('.slot');if(!sl)return;
  if(sl.dataset.hs)switchSlot(sl.dataset.hs);else if(sl.dataset.hm)useMed(sl.dataset.hm);else if(sl.dataset.hg)throwFrag();else if(sl.dataset.hk)throwSmoke();});
setMobile(MOBILE);
fillMissions();ensureSlot();
openPanel('start');
requestAnimationFrame(frame);
</script>
